services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:
    build: .
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 5601
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5601:5601"
    volumes:
      - ./outputs:/app/outputs
      - ./temp_uploads:/app/temp_uploads
    depends_on:
      - redis

  worker:
    build: .
    working_dir: /app
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./outputs:/app/outputs
      - ./temp_uploads:/app/temp_uploads
    depends_on:
      - redis
