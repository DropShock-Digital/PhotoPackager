[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'trap \"kill 0\" TERM INT; celery -A worker.celery_app worker --loglevel=${CELERY_LOGLEVEL:-info} & exec uvicorn main:app --host 0.0.0.0 --port ${PORT:-5601}'"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
REDIS_URL = "${{Redis.REDIS_URL}}"
CELERY_BROKER_URL = "${{Redis.REDIS_URL}}"
CELERY_RESULT_BACKEND = "${{Redis.REDIS_URL}}"
