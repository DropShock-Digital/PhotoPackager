name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: |
          python -m pytest -v

  build-frontend:
    name: Lint and Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm run build

  build-docker:
    name: Build and Smoke Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t photopackager-ci .

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f photopackager-ci >/dev/null 2>&1 || true' EXIT

          docker run -d --name photopackager-ci -p 5601:5601 photopackager-ci >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5601/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs photopackager-ci
          exit 1
